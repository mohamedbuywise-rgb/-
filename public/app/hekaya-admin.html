<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الحكاية · دبّر</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:#f1f5f4;color:#0f172a;font-size:14px}
header{background:#0b1f1a;color:#e8fff6;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:15px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e1ebe6;border-radius:16px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:15px}
label{display:block;font-size:12px;font-weight:800;color:#334155;margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid #cfdcd6;border-radius:12px;padding:10px 12px;font:600 14px 'Cairo',sans-serif;background:#fff}
textarea{min-height:200px;line-height:1.9;resize:vertical}
.hint{font-size:11px;color:#64748b;margin-top:4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btns{display:flex;gap:8px;margin-top:14px}
button{border:none;border-radius:12px;padding:12px 14px;font:800 14px 'Cairo',sans-serif;cursor:pointer;flex:1}
button:disabled{opacity:.5;cursor:default}
.g{background:#0f766e;color:#fff}.w{background:#fff;color:#0f766e;border:1.5px solid #0f766e}
.msg{font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
.msg.ok{color:#047857}.msg.err{color:#b91c1c}
.cover{display:flex;gap:12px;align-items:center;border:1.5px dashed #94a3b8;border-radius:14px;padding:12px;background:#f8fafc}
.cover img{width:150px;height:84px;object-fit:cover;border-radius:10px;background:#e2e8f0;flex:none}
.cover .ph{width:150px;height:84px;border-radius:10px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;font-weight:700;flex:none}
.cover input[type=file]{border:none;padding:0;font-size:12px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eef3f0;gap:10px}
.item:last-child{border:none}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.pub{background:#d1fae5;color:#065f46}.drf{background:#fef3c7;color:#92400e}
.item small{color:#64748b;font-size:11px}
.item button{flex:none;padding:7px 10px;font-size:12px}
#login{max-width:360px;margin:60px auto}
</style>
</head>
<body>
<header><b>إدارة الحكاية · دبّر</b><span id="who" style="font-size:12px;opacity:.8"></span></header>

<main id="login" class="card" style="display:none">
  <h3>دخول الأدمن</h3>
  <label>كلمة السر</label>
  <input id="pw" type="password" autocomplete="current-password">
  <div class="btns"><button class="g" id="loginBtn">دخول</button></div>
  <div class="msg" id="loginMsg"></div>
</main>

<main id="app" style="display:none">
  <section class="card">
    <h3 id="formTitle">عدد جديد</h3>
    <input type="hidden" id="id">
    <div class="row">
      <div><label>رقم العدد</label><input id="issue_no" type="number" min="1"></div>
      <div><label>تاريخ الأسبوع (اختياري)</label><input id="week_start" type="date"></div>
    </div>

    <label>العنوان</label>
    <input id="title" placeholder="مثال: الفلوس الصغيرة اللي بتضيع">
    <label>سطر تعريفي</label>
    <input id="subtitle" placeholder="جملة قصيرة تحت العنوان">
    <label>الموضوع</label>
    <input id="topic" list="topics" placeholder="اكتب الموضوع أو اختار">
    <datalist id="topics"><option>الميزانية</option><option>الادخار</option><option>الديون</option><option>الاشتراكات</option><option>عادات مالية</option></datalist>

    <label>رابط الفيديو (يوتيوب)</label>
    <input id="video_url" placeholder="https://www.youtube.com/watch?v=...">
    <div class="hint" id="ytHint">الفيديو بيتشغّل على يوتيوب، ومش بيترفع على دبّر.</div>

    <label>صورة الغلاف / صورة الفيديو</label>
    <div class="cover">
      <div id="coverPrev" class="ph">مفيش صورة</div>
      <div style="flex:1;min-width:0">
        <input type="file" id="coverFile" accept="image/jpeg,image/png,image/webp">
        <div class="hint" id="coverHint">ارفع صورة (JPG / PNG / WEBP) أقل من ٢ ميجا. هتتضغط تلقائياً.</div>
      </div>
    </div>
    <input type="hidden" id="cover_url">

    <label>عنوان الاستفتاء (اختياري، مطلوب لو فيه خيارات)</label>
    <input id="poll_question" placeholder="مثال: أنهي مصروف بيوجعك أكتر؟">
    <label>خيارات الاستفتاء (سطر لكل خيار، من ٢ لـ ٦)</label>
    <textarea id="poll_options" style="min-height:90px" placeholder="المواصلات والبنزين&#10;القهوة والأكل برا&#10;الاشتراكات المنسية"></textarea>

    <label>المقال</label>
    <textarea id="article_md" placeholder="اكتب المقال هنا. سطر فاضي = فقرة جديدة. ابدأ السطر بـ ## لعنوان فرعي، و> لاقتباس، و- لبند."></textarea>

    <div class="btns">
      <button class="w" id="saveBtn">حفظ كمسودة</button>
      <button class="g" id="pubBtn">نشر العدد</button>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h3>الأعداد</h3>
    <div id="list"></div>
  </section>
</main>

<script>
const API='/api/hekaya';
const $=s=>document.querySelector(s);
const msg=(t,ok)=>{const m=$('#msg');m.textContent=t;m.className='msg '+(ok?'ok':'err')};
const pw=()=>sessionStorage.getItem('hekayaPw')||'';
async function call(action,method='GET',body){
  const r=await fetch(`${API}?action=${action}`,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+pw()},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.ok===false) throw new Error(j.error||'حصل خطأ');
  return j;
}
function ytOk(u){return !u||/(?:v=|youtu\.be\/|embed\/|shorts\/)[A-Za-z0-9_-]{11}/.test(u)||/^[A-Za-z0-9_-]{11}$/.test(u)}
$('#video_url').oninput=e=>{const ok=ytOk(e.target.value.trim());$('#ytHint').textContent=ok?'✓ الفيديو اتعرف، هيتشغّل على يوتيوب.':'الرابط مش صحيح، لازم يكون رابط يوتيوب.';$('#ytHint').style.color=ok?'#047857':'#b91c1c'};

function setCover(url){
  $('#cover_url').value=url||'';
  $('#coverPrev').outerHTML=url?`<img id="coverPrev" src="${url}" alt="">`:'<div id="coverPrev" class="ph">مفيش صورة</div>';
}

// ضغط الصورة في المتصفح قبل الرفع (أقصى عرض 1280، JPEG)
function compress(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,1280/img.width);
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const dataUrl=c.toDataURL('image/jpeg',0.85);
      resolve({contentType:'image/jpeg',data:dataUrl.split(',')[1]});
    };
    img.onerror=()=>reject(new Error('الصورة مش مقروءة'));
    img.src=URL.createObjectURL(file);
  });
}
$('#coverFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  $('#coverHint').textContent='بيترفع...';
  try{
    const {contentType,data}=await compress(f);
    const r=await call('admin_upload_cover','POST',{content_type:contentType,data_base64:data});
    setCover(r.url);
    $('#coverHint').textContent='✓ اترفعت الصورة.';
  }catch(err){$('#coverHint').textContent=err.message;}
};

function form(){return{id:$('#id').value||undefined,issue_no:$('#issue_no').value,week_start:$('#week_start').value||null,title:$('#title').value,subtitle:$('#subtitle').value,topic:$('#topic').value,video_url:$('#video_url').value,cover_url:$('#cover_url').value,article_md:$('#article_md').value,poll_question:$('#poll_question').value,poll_options:$('#poll_options').value}}
async function save(publish){
  try{
    const r=await call('admin_save','POST',form());
    $('#id').value=r.id;
    if(publish){await call('admin_publish','POST',{id:r.id,publish:true});msg('اتنشر العدد ✨',true)}
    else msg('اتحفظ كمسودة ✓',true);
    await loadList();
  }catch(e){msg(e.message,false)}
}
$('#saveBtn').onclick=()=>save(false);
$('#pubBtn').onclick=()=>{if(confirm('تنشر العدد دلوقتي؟ هيظهر لكل المستخدمين.'))save(true)};

async function loadList(){
  const {issues}=await call('admin_list');
  $('#list').innerHTML=issues.length?issues.map(i=>`<div class="item"><div><b>عدد ${i.issue_no}: ${i.title}</b><br><small>${i.topic||'—'} · ${i.published_at?'نُشر '+new Date(i.published_at).toLocaleDateString('ar-EG'):'مسودة'}</small></div><div style="display:flex;gap:6px;align-items:center"><span class="badge ${i.status==='published'?'pub':'drf'}">${i.status==='published'?'منشور':'مسودة'}</span><button class="w" data-edit="${i.id}">تعديل</button></div></div>`).join(''):'<small>مفيش أعداد لسه.</small>';
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));
}
async function edit(id){
  const {issues}=await call('admin_list');
  const i=issues.find(x=>x.id===id); if(!i) return;
  $('#formTitle').textContent='تعديل العدد '+i.issue_no;
  $('#id').value=i.id;$('#issue_no').value=i.issue_no;$('#title').value=i.title||'';$('#subtitle').value=i.subtitle||'';$('#topic').value=i.topic||'';$('#week_start').value=i.week_start||'';$('#video_url').value=i.video_url||'';$('#article_md').value=i.article_md||'';$('#poll_question').value=i.poll_question||'';$('#poll_options').value=(i.poll_options||[]).join('\n');
  setCover(i.cover_url||'');
  msg('فتحت العدد للتعديل.',true);
  window.scrollTo({top:0,behavior:'smooth'});
}

$('#loginBtn').onclick=async()=>{sessionStorage.setItem('hekayaPw',$('#pw').value);
  try{await loadList();$('#login').style.display='none';$('#app').style.display='block';$('#who').textContent='أدمن'}
  catch(e){sessionStorage.removeItem('hekayaPw');$('#loginMsg').textContent=e.message;$('#loginMsg').className='msg err'}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};
(async()=>{if(pw()){try{await loadList();$('#app').style.display='block';$('#who').textContent='أدمن'}catch(e){$('#login').style.display='block'}}else $('#login').style.display='block'})();
</script>
</body>
</html>

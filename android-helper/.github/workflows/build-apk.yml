name: Build & Release Dabbar SMS Helper APK

# بيتشغل تلقائي مع أي تاج جديد (v1.0.0, v1.0.1...) أو يدويًا من تبويب Actions.
# النتيجة: ملف dabbar-sms-helper.apk موقّع، متاح على GitHub Releases، ونفس الرابط
# اللي backend/api-handlers/bank-accounts.js بيرجعه في apkDownloadUrl.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename output
        run: cp app/build/outputs/apk/release/app-release.apk dabbar-sms-helper.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: android-helper/dabbar-sms-helper.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============ إعداد لازم يتعمل مرة واحدة بس قبل أول تشغيل ============
# 1) تولّد keystore محلي مرة واحدة (لو معندكش واحد بالفعل):
#      keytool -genkeypair -v -keystore release.keystore -alias dabbar_sms_helper \
#        -keyalg RSA -keysize 2048 -validity 10000
# 2) تحوّله base64 وتضيفه كـ GitHub Secret اسمه ANDROID_KEYSTORE_BASE64:
#      base64 -w0 release.keystore > release.keystore.b64   (على ماك: base64 -i release.keystore)
# 3) تضيف 3 secrets تانيين في نفس المستودع (Settings → Secrets → Actions):
#      ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# 4) احتفظ بملف الـ keystore في مكان آمن — لو ضاع، مش هتقدر تنشر تحديثات
#    للتطبيق بنفس التوقيع تاني (أندرويد بيرفض تحديث تطبيق موقّع بمفتاح مختلف).
# 5) بعد أول push بتاج (git tag v1.0.0 && git push --tags)، هيبني وينشر الـ APK
#    تلقائي على: https://github.com/<org>/<repo>/releases/latest/download/dabbar-sms-helper.apk
#    — عدّل SMS_HELPER_APK_URL في environment variables السيرفر لو الرابط مختلف.

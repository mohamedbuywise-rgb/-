<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دبّر — فلوسك، من غير صداع</title>
<link rel="manifest" href="app/manifest.json">
<meta name="theme-color" content="#0B5CF0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="app/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="app/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دبّر">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--b:#0B5CF0;--b2:#308FF2;--soft:#EEF4FE;--ink:#0A1A33;--mut:#5B6B86;--line:#DCE4F2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#fff;color:var(--ink)}
.v{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px}
.v.on{display:flex}
.app{width:72px;height:72px;border-radius:17px;display:block}
h1{font:800 26px/1.45 'Cairo';margin-top:18px}
.sub{color:var(--mut);font-size:16px;line-height:1.8;max-width:300px;margin-top:6px}
/* install button */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;height:54px;margin-top:26px;border:0;border-radius:10px;background:var(--b);color:#fff;font:700 17px 'Cairo';overflow:hidden;cursor:pointer}
.btn:active{background:#0848C0}
.btn .fill{position:absolute;inset:0;background:#0848C0;transform-origin:right;transform:scaleX(0)}
.btn>*{position:relative}
.ic{width:26px;height:26px;flex:none}
.ic .ring{fill:none;stroke:rgba(255,255,255,.28);stroke-width:2}
.ic .prog{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:62.83;stroke-dashoffset:62.83;transform:rotate(-90deg);transform-origin:12px 12px;opacity:0}
.ic .arr{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .chk{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;opacity:0}
.btn.run .ring,.btn.run .prog{opacity:1}
.btn.run .arr{animation:drop 1s ease-in-out infinite}
.btn.done{background:#0A1A33}
.btn.done .ring{opacity:1;stroke:#fff}
.btn.done .prog,.btn.done .arr{opacity:0;animation:none}
.btn.done .chk{opacity:1;animation:draw .4s ease forwards}
@keyframes drop{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}70%{opacity:1}100%{transform:translateY(4px);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.plats{display:flex;gap:18px;margin-top:18px;color:var(--mut);font-size:14px}
.plats span{display:flex;align-items:center;gap:6px}
.plats svg{width:18px;height:18px;fill:var(--mut)}
.alt{margin-top:18px;font-size:14px;color:var(--mut)}
.alt a{color:var(--b);font-weight:700}
/* steps */
ol{list-style:none;display:grid;gap:0;width:100%;max-width:340px;text-align:right}
ol li{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.7}
ol li:last-child{border:0}
ol b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--b);color:var(--b);display:grid;place-items:center;font:700 13px 'Cairo';margin-top:1px}
ol li.act b{background:var(--b);color:#fff}
ol svg{width:18px;height:18px;vertical-align:-4px;stroke:var(--b);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* C */
.seg{display:flex;background:var(--soft);border-radius:10px;padding:4px;width:100%;max-width:340px;margin:22px 0 8px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:none;padding:10px;border-radius:7px;font:700 15px 'Cairo';color:var(--mut)}
.seg button.on{background:#fff;color:var(--b);box-shadow:0 1px 2px rgba(11,27,58,.12)}
.seg svg{width:18px;height:18px;fill:currentColor}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(11,27,58,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.mask.on{display:flex}
.sheet{width:100%;max-width:420px;background:#fff;border-radius:16px 16px 0 0;padding:20px 22px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font:800 18px 'Cairo';text-align:center;margin-bottom:6px}
.sheet ol{max-width:none}
.close{width:100%;height:48px;margin-top:10px;border:0;border-radius:10px;background:var(--soft);color:var(--b);font:700 16px 'Cairo'}
</style>
</head>

  <h1>ثبّت دبّر</h1>
  <div class="seg"><button data-p="and"><svg><use href="#i-and"/></svg>Android</button><button data-p="ios"><svg><use href="#i-ios"/></svg>iPhone</button></div>
  <ol class="js-steps"></ol>
  <button class="btn js-install"><span class="fill"></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="10"/><circle class="prog" cx="12" cy="12" r="10"/><path class="arr" d="M12 6.5v8m0 0l-3-3m3 3l3-3M8 18h8"/><path class="chk" d="M7.8 12.4l3 3 5.4-5.8"/></svg><span class="lb">تثبيت التطبيق</span></button>
</main>

<div class="mask" id="mask"><div class="sheet"><h2>إزاي تثبّت دبّر</h2><ol class="js-steps"></ol><button class="close" id="close">تمام</button></div></div>

<script>
(function(){
  var plat=/iPad|iPhone|iPod/.test(navigator.userAgent)?'ios':'and', dp=null, timer=null, cyc=null;
  var SH='<svg viewBox="0 0 24 24"><path d="M12 15V4m0 0L8.5 7.5M12 4l3.5 3.5M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>';
  var DT='<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>';
  var PL='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8.5v7M8.5 12h7"/></svg>';
  var S={
    and:['اضغط <b style="all:unset;font-weight:700">تثبيت التطبيق</b> من الزرار اللي تحت','أكّد من النافذة اللي هتظهر','افتح <b style="all:unset;font-weight:700">دبّر</b> من شاشتك الرئيسية'],
    ios:['افتح الصفحة في Safari واضغط زرار المشاركة '+SH,'اختار <b style="all:unset;font-weight:700">إضافة إلى الشاشة الرئيسية</b> '+PL,'اضغط <b style="all:unset;font-weight:700">إضافة</b> وافتح دبّر من شاشتك']
  };
  var F={and:['افتح قايمة المتصفح '+DT,'اختار <b style="all:unset;font-weight:700">تثبيت التطبيق</b> أو <b style="all:unset;font-weight:700">إضافة إلى الشاشة الرئيسية</b>','افتح <b style="all:unset;font-weight:700">دبّر</b> من شاشتك الرئيسية'],ios:S.ios};
  function steps(){
    var L=function(a){return a.map(function(s,i){return '<li><b>'+(i+1)+'</b><span>'+s+'</span></li>'}).join('')};
    document.querySelectorAll('.js-steps').forEach(function(o){o.innerHTML=L(o.closest('.sheet')?F[plat]:S[plat])});
    document.querySelectorAll('[data-p]').forEach(function(b){b.classList.toggle('on',b.dataset.p===plat)});
  }
  function setPlat(p){plat=p;steps();reset()}
  function reset(){
    clearInterval(timer);
    document.querySelectorAll('.js-install').forEach(function(b){b.className='btn js-install';b.querySelector('.lb').textContent='تثبيت التطبيق';b.querySelector('.prog').style.strokeDashoffset=62.83;b.querySelector('.fill').style.transform='scaleX(0)';b.disabled=false});
  }
  var installed=false;
  function finish(b){clearInterval(timer);var lb=b.querySelector('.lb');b.querySelector('.prog').style.strokeDashoffset=0;b.querySelector('.fill').style.transform='scaleX(1)';b.classList.remove('run');b.classList.add('done');lb.textContent='تم التثبيت، افتح دبّر من شاشتك'}
  function run(b){
    var t0=Date.now(),lb=b.querySelector('.lb'),pg=b.querySelector('.prog'),fl=b.querySelector('.fill');
    b.disabled=true;b.classList.add('run');
    timer=setInterval(function(){
      var el=Date.now()-t0,x=Math.min(el/3500,1),p=0.92*(1-Math.pow(1-x,2.2));
      pg.style.strokeDashoffset=62.83*(1-p);fl.style.transform='scaleX('+p+')';
      lb.textContent=x<1?'جاري التثبيت '+Math.round(p*100)+'%':'بنخلّص التثبيت...';
      if((installed&&x>=0.5)||el>=12000)finish(b);
    },40);
  }
  function sheet(on){
    var m=document.getElementById('mask');m.classList.toggle('on',on);clearInterval(cyc);
    if(on){var li=m.querySelectorAll('li'),i=0;cyc=setInterval(function(){li.forEach(function(e,k){e.classList.toggle('act',k===i)});i=(i+1)%li.length},1500)}
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
  window.addEventListener('appinstalled',function(){installed=true;var b=document.querySelector('.js-install');if(b&&!b.classList.contains('run')&&!b.classList.contains('done'))run(b)});
  if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone){location.replace('app/dabbar-onboarding.html')}
  document.querySelectorAll('.js-install').forEach(function(b){b.addEventListener('click',function(){
    if(dp){dp.prompt();dp.userChoice.then(function(r){dp=null;if(r.outcome==='accepted')run(b)});return}
    sheet(true);
  })});
  document.getElementById('close').onclick=function(){sheet(false)};
  document.querySelectorAll('[data-p]').forEach(function(b){b.addEventListener('click',function(){setPlat(b.dataset.p)})});
  steps();
})();
</script>

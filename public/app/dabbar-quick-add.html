<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل سريع — دبّر</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E655B">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    width: 100%; min-width: 100%; max-width: 100%; height: 100%;
    overflow-x: hidden; background: #06231F;
  }
  body {
    margin: 0; min-height: 100%; min-height: 100dvh;
    width: 100vw; min-width: 100vw; max-width: 100vw;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    color: #fff; display: flex; align-items: center; justify-content: center; padding: 20px;
    position: relative; overflow-x: hidden; overflow-x: clip; overflow-y: auto;
    background: #06231F;
  }
  @supports not (overflow: clip) {
    body { overflow-x: hidden; }
  }
  /* ============ خلفية بهوية دبّر (أخضر غامق + توهج كهرماني) بدل الشكل العام لمساعدي الذكاء الاصطناعي ============ */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    width: 100vw; max-width: 100vw; height: 100dvh; min-height: 100%;
    background: #06231F;
  }
  .bg-layer::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 120%, #0E655B 0%, #0A423B 45%, #06231F 75%);
  }
  .glow {
    position: fixed; z-index: 0; max-width: 100vw; max-height: 100dvh;
    border-radius: 50%; filter: blur(70px); pointer-events: none;
  }
  .glow.g1 { width: 300px; height: 300px; background: rgba(255, 185, 90, .22); top: -70px; left: -60px; }
  .glow.g2 { width: 260px; height: 260px; background: rgba(79, 216, 196, .28); bottom: -60px; right: -50px; }

  .brand-mark {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px; position: relative; z-index: 1;
    background: linear-gradient(155deg, #FFC96B 0%, #4FD8C4 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 26px rgba(0,0,0,.35);
  }
  .brand-mark svg { width: 28px; height: 28px; }

  .card {
    width: min(100%, 380px); max-width: 380px; min-width: 0;
    position: relative; z-index: 1;
    text-align: center;
    animation: cardIn .45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .fields { text-align: right; }

  .eyebrow { font-size: 12px; opacity: .65; margin: 0 0 4px; letter-spacing: .3px; }
  .headline { font-size: 17px; font-weight: 700; margin: 0 0 22px; line-height: 1.5; }

  /* ============ تبديل الوضعين: كتابة / صوت ============ */
  .mode-switch {
    display: flex; position: relative; background: rgba(255,255,255,.12);
    border-radius: 12px; padding: 4px; margin-bottom: 14px;
  }
  .mode-switch button {
    flex: 1; position: relative; z-index: 1; background: transparent; border: none; color: rgba(255,255,255,.75);
    font-size: 13px; font-weight: 700; padding: 9px 8px; border-radius: 9px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: color .2s ease;
  }
  .mode-switch button.active { color: #0E655B; }
  .mode-switch .pill {
    position: absolute; top: 4px; bottom: 4px; width: calc(33.333% - 5.33px); right: 4px;
    background: #fff; border-radius: 9px; transition: transform .28s cubic-bezier(.3,.8,.3,1);
  }
  .mode-switch.mode-voice .pill { transform: translateX(-100%); }
  .mode-switch.mode-invoice .pill { transform: translateX(-200%); }

  textarea {
    width: 100%; min-height: 70px; border-radius: 12px; border: none; padding: 12px 14px;
    font-family: inherit; font-size: 14px; resize: vertical; background: rgba(255,255,255,.12); color: #fff;
    outline: none;
  }
  textarea::placeholder { color: rgba(255,255,255,.6); }

  .row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .row span:first-child { font-size: 12px; opacity: .85; }
  .row span:last-child { font-size: 15px; font-weight: 700; }

  button.btn-primary, button.btn-secondary { border: none; border-radius: 10px; font-size: 14px; font-weight: 700; padding: 12px; cursor: pointer; width: 100%; transition: transform .12s ease, opacity .2s ease; }
  button.btn-primary:active, button.btn-secondary:active { transform: scale(.98); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: #fff; color: #0E655B; margin-top: 6px; }
  .btn-secondary { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); margin-top: 8px; }

  .status { text-align: center; font-size: 13px; margin-top: 14px; min-height: 18px; opacity: .9; }
  .success { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 10px 0; }
  .check { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 22px; animation: pop .35s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .hidden { display: none !important; }
  a.link { color: #fff; text-decoration: underline; font-size: 13px; }

  /* ============ منطقة التسجيل الصوتي ============ */
  .voice-pane { display: flex; flex-direction: column; align-items: center; padding: 10px 0 4px; }
  .mic-wrap { position: relative; width: 116px; height: 116px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .mic-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); }
  .mic-ring.pulse { animation: micPulse 1.6s ease-out infinite; }
  @keyframes micPulse { 0% { transform: scale(.72); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }
  .mic-btn {
    position: relative; z-index: 1; width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: #fff; color: #0E655B; display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, background .2s ease;
  }
  .mic-btn:active { transform: scale(.94); }
  .mic-btn.recording { background: #FF5A5A; color: #fff; }
  .mic-btn svg { width: 34px; height: 34px; }
  .voice-hint { font-size: 13px; opacity: .85; text-align: center; margin: 0 0 4px; min-height: 18px; }
  .rec-timer { font-size: 22px; font-weight: 800; letter-spacing: 1px; margin: 2px 0 10px; font-variant-numeric: tabular-nums; }

  .voice-preview { width: 100%; padding-top: 4px; }
  .voice-preview audio { width: 1px; height: 1px; position: absolute; opacity: 0; pointer-events: none; }
  .voice-wave-shell { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(0,0,0,.12); }
  .voice-wave-shell.live { border-color: rgba(255,90,90,.35); background: rgba(255,90,90,.08); }
  .voice-wave-canvas { display: block; width: 100%; height: 58px; min-width: 0; cursor: pointer; touch-action: none; }
  .voice-wave-canvas.live-canvas { cursor: default; }
  .voice-wave-play { flex: 0 0 38px; width: 38px; height: 38px; border: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #fff; color: #0E655B; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform .15s ease, background .2s ease; }
  .voice-wave-play:active { transform: scale(.94); }
  .voice-wave-play.is-playing { background: #FFC96B; }
  .voice-wave-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; padding-inline: 2px; font-size: 10px; font-variant-numeric: tabular-nums; opacity: .72; }
  .voice-wave-live-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: #FF5A5A; box-shadow: 0 0 0 5px rgba(255,90,90,.12); animation: liveDot 1.1s ease-in-out infinite; }
  @keyframes liveDot { 0%,100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.08); } }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { margin-top: 0; }
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="card">
  <div class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#06231F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M3 6h18v12H3z"/><circle cx="16.5" cy="14.5" r="1.5" fill="#06231F" stroke="none"/></svg>
  </div>
  <p class="eyebrow" id="eyebrow">تسجيل مصروف سريع</p>
  <h1 class="headline" id="headline">دبّر بيفهم العملية...</h1>

  <div class="fields">
    <div id="mode-switch" class="mode-switch hidden">
      <div class="pill"></div>
      <button type="button" id="mode-text-btn" class="active">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
        كتابة
      </button>
      <button type="button" id="mode-voice-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v3"/></svg>
        صوت
      </button>
      <button type="button" id="mode-invoice-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        فاتورة
      </button>
    </div>

    <div id="input-view" class="hidden">
      <div id="text-pane">
        <textarea id="text-input" placeholder="اكتب العملية هنا، زي: دفعت 50 جنيه قهوة"></textarea>
        <button class="btn-primary" id="analyze-btn">تحليل العملية</button>
      </div>

      <div id="voice-pane" class="voice-pane hidden">
        <div id="voice-idle">
          <div class="mic-wrap">
            <div class="mic-ring"></div>
            <button type="button" class="mic-btn" id="mic-btn" aria-label="ابدأ التسجيل">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v3M8 22h8"/></svg>
            </button>
          </div>
          <p class="voice-hint">اضغط وابدأ الكلام: قول المبلغ والتصنيف بوضوح</p>
        </div>

        <div id="voice-recording" class="hidden" style="width:100%; text-align:center;">
          <div class="mic-wrap">
            <div class="mic-ring pulse"></div>
            <button type="button" class="mic-btn recording" id="mic-stop-btn" aria-label="إيقاف التسجيل">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
          </div>
          <p class="rec-timer" id="rec-timer">00:00</p>
          <div class="voice-wave-shell live" aria-label="موجة الصوت أثناء التسجيل">
            <span class="voice-wave-live-dot" aria-hidden="true"></span>
            <canvas id="voice-live-waveform" class="voice-wave-canvas live-canvas" height="58"></canvas>
          </div>
          <p class="voice-hint">بيسمع دلوقتي... اضغط تاني عشان توقف</p>
        </div>

        <div id="voice-preview" class="voice-preview hidden">
          <div class="voice-wave-shell" aria-label="مشغل التسجيل الصوتي">
            <button type="button" id="voice-wave-play" class="voice-wave-play" aria-label="تشغيل التسجيل">▶</button>
            <div style="min-width:0;flex:1;">
              <canvas id="voice-preview-waveform" class="voice-wave-canvas" height="58" aria-label="الموجة الصوتية؛ اضغط عليها للانتقال داخل التسجيل"></canvas>
              <div class="voice-wave-meta"><span id="voice-wave-current">00:00</span><span id="voice-wave-duration">00:00</span></div>
            </div>
          </div>
          <audio id="voice-audio" preload="metadata"></audio>
          <div class="btn-row">
            <button class="btn-secondary" id="voice-retry-btn">إعادة التسجيل</button>
            <button class="btn-primary" id="voice-send-btn">تحليل الصوت</button>
          </div>
        </div>
      </div>

      <div id="invoice-pane" class="hidden">
        <div id="invoice-idle" style="text-align:center;">
          <p class="voice-hint" style="margin-bottom:14px;">صوّر الفاتورة أو ارفع صورة موجودة عندك، ودبّر هيقرا الأصناف والمبلغ</p>
          <div class="btn-row" style="flex-direction:column; gap:10px;">
            <button type="button" class="btn-primary" id="invoice-camera-btn">📷 تصوير الفاتورة</button>
            <button type="button" class="btn-secondary" id="invoice-upload-btn">رفع صورة من المعرض</button>
          </div>
          <input type="file" id="invoice-camera-input" accept="image/*" capture="environment" class="hidden">
          <input type="file" id="invoice-upload-input" accept="image/*" class="hidden">
        </div>
        <div id="invoice-preview" class="hidden" style="text-align:center;">
          <img id="invoice-preview-img" style="max-width:100%; max-height:220px; border-radius:12px; margin-bottom:12px;">
          <div class="btn-row">
            <button class="btn-secondary" id="invoice-retry-btn">صورة تانية</button>
            <button class="btn-primary" id="invoice-send-btn">تحليل الفاتورة</button>
          </div>
        </div>
      </div>
    </div>

    <div id="draft-view" class="hidden"></div>
  </div>

  <div id="success-view" class="success hidden">
    <div class="check">✓</div>
    <p id="success-text" style="margin:0;font-weight:700;font-size:15px;"></p>
  </div>

  <div id="auth-view" class="hidden" style="text-align:center;">
    <p style="font-size:14px;opacity:.9;">سجّل دخولك في تطبيق دبّر الأول عشان تقدر تسجّل مصروف من هنا.</p>
    <a class="link" href="./dabbar-onboarding.html">فتح دبّر لتسجيل الدخول</a>
  </div>

  <p class="status" id="status"></p>
  <button class="btn-secondary hidden" id="open-app-btn">فتح دبّر</button>
</div>

<script>
  const SUPABASE_URL = 'https://devywtyfzybnahdsqdkd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_yHiX1cnEMCVEcjQxiIrqig_DRBiuveQ';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const show = (id, on) => $(id)?.classList.toggle('hidden', !on);
  const typeLabel = (t) => ({ expense: 'مصروف', income: 'دخل', purchase: 'شراء', asset: 'أصل', transfer: 'تحويل', refund: 'استرداد', debt: 'دين', invoice: 'فاتورة' }[t] || 'عملية مالية');
  const fmt = (n) => Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });

  let accessToken = null;
  let drafts = [];

  // ============ حالة وضع الإدخال (كتابة / صوت) ============
  let inputMode = 'text';
  function setMode(mode) {
    inputMode = mode;
    const isVoice = mode === 'voice';
    const isInvoice = mode === 'invoice';
    $('mode-switch')?.classList.toggle('mode-voice', isVoice);
    $('mode-switch')?.classList.toggle('mode-invoice', isInvoice);
    $('mode-text-btn')?.classList.toggle('active', mode === 'text');
    $('mode-voice-btn')?.classList.toggle('active', isVoice);
    $('mode-invoice-btn')?.classList.toggle('active', isInvoice);
    show('text-pane', mode === 'text');
    show('voice-pane', isVoice);
    show('invoice-pane', isInvoice);
    if (isVoice) {
      show('voice-idle', true); show('voice-recording', false); show('voice-preview', false);
    }
    if (isInvoice) {
      show('invoice-idle', true); show('invoice-preview', false);
      invoiceFile = null;
    }
    $('status').textContent = '';
  }
  $('mode-text-btn')?.addEventListener('click', () => setMode('text'));
  $('mode-voice-btn')?.addEventListener('click', () => setMode('voice'));
  $('mode-invoice-btn')?.addEventListener('click', () => setMode('invoice'));

  function getSharedText() {
    const params = new URLSearchParams(window.location.search);
    return (params.get('text') || params.get('title') || '').trim();
  }
  function isSharedLaunch() {
    return new URLSearchParams(window.location.search).get('shared') === '1';
  }

  async function callAssistant(action, payload) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 45000);
    try {
      const res = await fetch('/api/assistant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
        body: JSON.stringify({ action, ...payload }),
        signal: controller.signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'حصل خطأ، جرب تاني.');
      return data;
    } finally {
      clearTimeout(timeout);
    }
  }

  function renderDraft(list) {
    drafts = Array.isArray(list) ? list : [list];
    $('headline').textContent = 'راجع قبل الحفظ';
    show('mode-switch', false);
    const html = drafts.map((d) => {
      const isDebt = d.type === 'debt';
      const title = (d.note && d.note.trim()) || (isDebt ? d.person : d.category) || typeLabel(d.type);
      const meta = [typeLabel(d.type), isDebt ? d.person : d.category].filter(Boolean).join(' · ');
      return `<div class="row"><span>${title}${meta ? ' — ' + meta : ''}</span><span>${fmt(d.amount)} ج.م</span></div>`;
    }).join('');
    $('draft-view').innerHTML = html + `
      <button class="btn-primary" id="confirm-btn">تأكيد التسجيل</button>
      <button class="btn-secondary" id="edit-btn">تعديل</button>`;
    show('draft-view', true);
    show('input-view', false);
    $('confirm-btn').addEventListener('click', confirmDraft);
    $('edit-btn').addEventListener('click', () => {
      show('draft-view', false);
      show('input-view', true);
      show('mode-switch', true);
      setMode('text');
      $('headline').textContent = 'عدّل العملية';
      $('text-input').value = drafts[0]?.sourceText || '';
    });
  }

  async function analyzeText(text) {
    $('status').textContent = 'دبّر بيفهم العملية...';
    try {
      const result = await callAssistant('entry_draft', { text });
      $('status').textContent = '';
      renderDraft(result.drafts);
    } catch (e) {
      $('status').textContent = e.message || 'تعذر فهم العملية.';
      show('input-view', true);
      show('mode-switch', true);
      $('headline').textContent = 'اكتب العملية';
    }
  }

  const MAX_AUDIO_DURATION_SECONDS = 30;

  function readAudioDuration(file) {
    return new Promise((resolve) => {
      const audio = document.createElement('audio');
      const objectUrl = URL.createObjectURL(file);
      let settled = false;
      const finish = (duration) => {
        if (settled) return;
        settled = true;
        URL.revokeObjectURL(objectUrl);
        audio.removeAttribute('src');
        audio.load();
        resolve(Number.isFinite(duration) ? duration : null);
      };
      audio.preload = 'metadata';
      audio.onloadedmetadata = () => finish(audio.duration);
      audio.onerror = () => finish(null);
      audio.src = objectUrl;
      setTimeout(() => finish(null), 6000);
    });
  }

  function showAudioTooLongMessage() {
    $('headline').textContent = 'التسجيل أطول من المسموح';
    $('status').textContent = 'الـ voice عدى 30 ثانية. ابعت تسجيل أقصر من 30 ثانية وجرب تاني.';
    show('input-view', true);
    show('mode-switch', true);
    setMode('voice');
  }

  async function analyzeAudio(audioBase64, mimeType, audioDurationSeconds = null) {
    $('status').textContent = 'بنفرّغ الصوت ونفهم العملية...';
    show('mode-switch', false);
    try {
      const payload = { audioBase64, mimeType };
      if (Number.isFinite(audioDurationSeconds)) payload.audioDurationSeconds = audioDurationSeconds;
      const result = await callAssistant('entry_draft', payload);
      $('status').textContent = '';
      renderDraft(result.drafts);
    } catch (e) {
      $('status').textContent = e.message || 'تعذر فهم التسجيل الصوتي.';
      show('input-view', true);
      show('mode-switch', true);
      setMode('voice');
      $('headline').textContent = 'اكتب أو سجّل العملية';
    }
  }

  async function confirmDraft() {
    const btn = $('confirm-btn');
    btn.disabled = true;
    $('status').textContent = 'جاري الحفظ...';
    try {
      const result = await callAssistant('entry_confirm', { drafts });
      show('draft-view', false);
      $('success-text').textContent = result.message || 'تم التسجيل بنجاح';
      show('success-view', true);
      show('open-app-btn', true);
      $('status').textContent = '';
    } catch (e) {
      $('status').textContent = e.message || 'تعذر الحفظ، جرب تاني.';
      btn.disabled = false;
    }
  }

  $('analyze-btn')?.addEventListener('click', () => {
    const text = $('text-input').value.trim();
    if (!text) { $('status').textContent = 'اكتب العملية الأول.'; return; }
    analyzeText(text);
  });

  $('open-app-btn')?.addEventListener('click', () => { window.location.href = './dabbar-dashboard-full.html'; });

  // ============ التسجيل الصوتي المباشر داخل الصفحة (Web Audio / MediaRecorder) ============
  // نفس منطق ونفس حدود لوحة التحكم الرئيسية (5 ثواني كحد أدنى، 30 ثانية كحد أقصى) عشان تجربة موحدة.
  let recorder = null;
  let chunks = [];
  let seconds = 0;
  let timerHandle = null;
  let recordedBlob = null;
  let liveAudioContext = null;
  let liveAnalyser = null;
  let liveAnimationId = null;
  let previewWaveform = [];
  let previewObjectUrl = null;
  let previewWaveformRaf = null;

  function formatAudioTime(value) {
    const total = Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
    return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
  }

  function drawVoiceWave(canvas, values = [], progress = 0, live = false) {
    if (!canvas) return;
    const width = Math.max(160, canvas.clientWidth || 320);
    const height = 58;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    const bars = Math.max(36, Math.floor(width / 4));
    const gap = 2;
    const barWidth = Math.max(1.5, (width - gap * (bars - 1)) / bars);
    const center = height / 2;
    for (let i = 0; i < bars; i++) {
      const position = bars === 1 ? 0 : i / (bars - 1);
      let amplitude = values.length ? values[Math.min(values.length - 1, Math.floor(position * values.length))] : 0.08;
      amplitude = Math.max(.055, Math.min(1, Number(amplitude) || 0));
      const barHeight = Math.max(3, amplitude * (height - 9));
      const x = i * (barWidth + gap);
      const passed = !live && position <= progress;
      ctx.fillStyle = live ? 'rgba(255,255,255,.82)' : (passed ? '#FFC96B' : 'rgba(79,216,196,.58)');
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, center - barHeight / 2, barWidth, barHeight, barWidth / 2);
      else ctx.rect(x, center - barHeight / 2, barWidth, barHeight);
      ctx.fill();
    }
  }

  function stopLiveVoiceWave() {
    if (liveAnimationId) cancelAnimationFrame(liveAnimationId);
    liveAnimationId = null;
    if (liveAudioContext) { liveAudioContext.close().catch(() => {}); liveAudioContext = null; }
    liveAnalyser = null;
  }

  async function startLiveVoiceWave(stream) {
    stopLiveVoiceWave();
    try {
      liveAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (liveAudioContext.state !== 'running') await liveAudioContext.resume();
      if (!liveAudioContext || liveAudioContext.state === 'closed') return;
      liveAnalyser = liveAudioContext.createAnalyser();
      liveAnalyser.fftSize = 256;
      liveAudioContext.createMediaStreamSource(stream).connect(liveAnalyser);
      const data = new Uint8Array(liveAnalyser.fftSize);
      const draw = () => {
        if (!liveAnalyser) return;
        liveAnalyser.getByteTimeDomainData(data);
        const values = [];
        for (let i = 0; i < data.length; i += 3) values.push(Math.abs(data[i] - 128) / 42);
        drawVoiceWave($('voice-live-waveform'), values, 0, true);
        liveAnimationId = requestAnimationFrame(draw);
      };
      draw();
    } catch (error) {
      console.warn('VOICE_WAVE_MONITOR_FAILED', error);
      drawVoiceWave($('voice-live-waveform'), [.12, .2, .15, .1], 0, true);
    }
  }

  function clearVoicePreview() {
    const audio = $('voice-audio');
    if (audio) {
      audio.pause();
      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = null;
      audio.removeAttribute('src');
      audio.load();
    }
    previewWaveform = [];
    if (previewWaveformRaf) cancelAnimationFrame(previewWaveformRaf);
    previewWaveformRaf = null;
    if ($('voice-wave-play')) { $('voice-wave-play').textContent = '▶'; $('voice-wave-play').classList.remove('is-playing'); }
    if ($('voice-wave-current')) $('voice-wave-current').textContent = '00:00';
    if ($('voice-wave-duration')) $('voice-wave-duration').textContent = '00:00';
    drawVoiceWave($('voice-preview-waveform'));
  }

  async function buildVoicePreview(blob) {
    const audio = $('voice-audio');
    if (!audio) return;
    previewWaveform = [];
    try {
      const context = new (window.AudioContext || window.webkitAudioContext)();
      const buffer = await context.decodeAudioData(await blob.arrayBuffer());
      const channel = buffer.getChannelData(0);
      const bars = 150;
      const block = Math.max(1, Math.floor(channel.length / bars));
      for (let i = 0; i < bars; i++) {
        let peak = 0;
        const start = i * block;
        const end = Math.min(channel.length, start + block);
        for (let j = start; j < end; j++) peak = Math.max(peak, Math.abs(channel[j]));
        previewWaveform.push(peak);
      }
      await context.close();
    } catch (error) {
      console.warn('VOICE_WAVE_DECODE_FAILED', error);
      previewWaveform = Array.from({ length: 150 }, (_, i) => .13 + Math.abs(Math.sin(i * .62)) * .22);
    }
    drawVoiceWave($('voice-preview-waveform'), previewWaveform, audio.duration ? audio.currentTime / audio.duration : 0);
  }

  function setVoicePreview(blob) {
    const audio = $('voice-audio');
    if (!audio) return;
    clearVoicePreview();
    previewObjectUrl = URL.createObjectURL(blob);
    audio.src = previewObjectUrl;
    buildVoicePreview(blob);
  }

  function updateVoicePreviewProgress() {
    const audio = $('voice-audio');
    if (!audio) return;
    const progress = audio.duration ? audio.currentTime / audio.duration : 0;
    if ($('voice-wave-current')) $('voice-wave-current').textContent = formatAudioTime(audio.currentTime);
    if ($('voice-wave-duration')) $('voice-wave-duration').textContent = formatAudioTime(audio.duration);
    drawVoiceWave($('voice-preview-waveform'), previewWaveform, progress);
    if (!audio.paused) previewWaveformRaf = requestAnimationFrame(updateVoicePreviewProgress);
  }

  $('voice-wave-play')?.addEventListener('click', async () => {
    const audio = $('voice-audio');
    if (!audio?.src) return;
    if (audio.paused) await audio.play().catch(() => {}); else audio.pause();
  });
  $('voice-audio')?.addEventListener('play', () => {
    $('voice-wave-play').textContent = '❚❚';
    $('voice-wave-play').classList.add('is-playing');
    updateVoicePreviewProgress();
  });
  $('voice-audio')?.addEventListener('pause', () => {
    $('voice-wave-play').textContent = '▶';
    $('voice-wave-play').classList.remove('is-playing');
    if (previewWaveformRaf) cancelAnimationFrame(previewWaveformRaf);
    updateVoicePreviewProgress();
  });
  $('voice-audio')?.addEventListener('ended', () => {
    $('voice-wave-play').textContent = '▶';
    $('voice-wave-play').classList.remove('is-playing');
    updateVoicePreviewProgress();
  });
  $('voice-audio')?.addEventListener('loadedmetadata', updateVoicePreviewProgress);
  $('voice-preview-waveform')?.addEventListener('click', (event) => {
    const audio = $('voice-audio');
    if (!audio?.duration) return;
    const rect = event.currentTarget.getBoundingClientRect();
    audio.currentTime = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)) * audio.duration;
    updateVoicePreviewProgress();
  });
  window.addEventListener('resize', () => {
    drawVoiceWave($('voice-live-waveform'), [], 0, true);
    drawVoiceWave($('voice-preview-waveform'), previewWaveform, $('voice-audio')?.duration ? $('voice-audio').currentTime / $('voice-audio').duration : 0);
  });

  function pickVoiceMimeType() {
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/ogg'];
    for (const type of candidates) { if (window.MediaRecorder?.isTypeSupported?.(type)) return type; }
    return '';
  }

  async function startRecording() {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      $('status').textContent = 'المتصفح لا يدعم التسجيل الصوتي.';
      return;
    }
    if (recorder?.state === 'recording') return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      seconds = 0;
      const mimeType = pickVoiceMimeType();
      recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      startLiveVoiceWave(stream);
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        stopLiveVoiceWave();
        clearInterval(timerHandle);
        show('voice-recording', false);
        if (seconds < 5) {
          $('status').textContent = 'التسجيل قصير جدًا. اتكلم شوية كمان وسجّل من جديد.';
          show('voice-idle', true);
          return;
        }
        const blob = new Blob(chunks, { type: recorder.mimeType || mimeType || 'audio/webm' });
        if (!blob.size) {
          $('status').textContent = 'مسجلناش أي صوت — تأكد من إذن الميكروفون وجرب تاني.';
          show('voice-idle', true);
          return;
        }
        recordedBlob = blob;
        setVoicePreview(blob);
        show('voice-preview', true);
      };
      recorder.start(1000);
      $('status').textContent = '';
      show('voice-idle', false);
      show('voice-preview', false);
      show('voice-recording', true);
      $('rec-timer').textContent = '00:00';
      timerHandle = setInterval(() => {
        seconds++;
        $('rec-timer').textContent = `00:${String(seconds).padStart(2, '0')}`;
        if (seconds >= 30) recorder.stop();
      }, 1000);
    } catch {
      $('status').textContent = 'لازم تسمح للموقع باستخدام الميكروفون.';
    }
  }
  function stopRecording() { if (recorder?.state === 'recording') recorder.stop(); }

  $('mic-btn')?.addEventListener('click', startRecording);
  $('mic-stop-btn')?.addEventListener('click', stopRecording);
  $('voice-retry-btn')?.addEventListener('click', () => {
    recordedBlob = null;
    clearVoicePreview();
    show('voice-preview', false);
    show('voice-idle', true);
    $('status').textContent = '';
  });
  $('voice-send-btn')?.addEventListener('click', () => {
    if (!recordedBlob) return;
    $('voice-audio')?.pause();
    show('voice-preview', false);
    const reader = new FileReader();
    reader.onloadend = () => analyzeAudio(reader.result, recordedBlob.type, seconds);
    reader.readAsDataURL(recordedBlob);
  });

  // ============ فاتورة: تصوير أو رفع صورة، بنفس محرك "امسح فاتورة" (entry_invoice_draft) — بيستخدم نفس حد الـ50 فاتورة الشهري أيًا كان مصدر الصورة ============
  let invoiceFile = null;
  function setInvoicePreview(file) {
    invoiceFile = file;
    $('invoice-preview-img').src = URL.createObjectURL(file);
    show('invoice-idle', false);
    show('invoice-preview', true);
  }
  $('invoice-camera-btn')?.addEventListener('click', () => $('invoice-camera-input')?.click());
  $('invoice-upload-btn')?.addEventListener('click', () => $('invoice-upload-input')?.click());
  $('invoice-camera-input')?.addEventListener('change', (e) => { const f = e.target.files?.[0]; if (f) setInvoicePreview(f); e.target.value = ''; });
  $('invoice-upload-input')?.addEventListener('change', (e) => { const f = e.target.files?.[0]; if (f) setInvoicePreview(f); e.target.value = ''; });
  $('invoice-retry-btn')?.addEventListener('click', () => { invoiceFile = null; show('invoice-preview', false); show('invoice-idle', true); $('status').textContent = ''; });
  $('invoice-send-btn')?.addEventListener('click', () => {
    if (!invoiceFile) return;
    show('invoice-preview', false);
    const reader = new FileReader();
    reader.onloadend = () => analyzeInvoiceImage(reader.result);
    reader.readAsDataURL(invoiceFile);
  });

  async function analyzeInvoiceImage(imageBase64) {
    $('status').textContent = 'بنقرا الفاتورة...';
    show('mode-switch', false);
    try {
      const result = await callAssistant('entry_invoice_draft', { imageBase64 });
      $('status').textContent = '';
      renderDraft(result.drafts);
    } catch (e) {
      $('status').textContent = e.message || 'معرفتش أقرا الفاتورة. جرّب صورة أوضح.';
      show('input-view', true);
      show('mode-switch', true);
      setMode('invoice');
    }
  }

  // ============ استقبال ملف صوتي أو صورة فاتورة عبر "مشاركة" (Share Target) ============
  // الملف بيتخزن مؤقتًا في IndexedDB بواسطة الـ Service Worker (sw.js) وقت استقبال الـ POST،
  // وهنا بنقراه، نحوّله لـ base64، وننضفه من التخزين فورًا عشان مايتبعتش مرتين بالغلط.
  const SHARE_DB_NAME = 'dabbar-share-db';
  const SHARE_STORE = 'files';
  const SHARE_KEY_AUDIO = 'pending-audio';
  const SHARE_KEY_IMAGE = 'pending-image';

  function openShareDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(SHARE_DB_NAME, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(SHARE_STORE)) req.result.createObjectStore(SHARE_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function takeSharedFile(key) {
    try {
      const db = await openShareDb();
      const file = await new Promise((resolve, reject) => {
        const tx = db.transaction(SHARE_STORE, 'readwrite');
        const store = tx.objectStore(SHARE_STORE);
        const getReq = store.get(key);
        getReq.onsuccess = () => {
          const result = getReq.result;
          store.delete(key);
          resolve(result || null);
        };
        getReq.onerror = () => reject(getReq.error);
      });
      db.close();
      return file;
    } catch {
      return null;
    }
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function isLikelyAudioFile(file) {
    const type = String(file?.type || '').toLowerCase();
    const name = String(file?.name || '').toLowerCase();
    return type.startsWith('audio/') || /\.(ogg|oga|opus|mp3|m4a|wav|amr|aac|3gp|flac|caf|mka)$/.test(name);
  }

  function isLikelyImageFile(file) {
    const type = String(file?.type || '').toLowerCase();
    const name = String(file?.name || '').toLowerCase();
    return type.startsWith('image/') || /\.(jpg|jpeg|png|webp|heic)$/.test(name);
  }

  function getSharedKind() {
    try { return new URLSearchParams(window.location.search).get('kind') || ''; } catch { return ''; }
  }

  // فاتورة جاية عبر مشاركة صورة: بتتعامل بنفس محرك entry_invoice_draft، وبتاخد من نفس حد الـ50 فاتورة الشهري
  // مهما كان مصدر الصورة (تصوير مباشر، رفع من المعرض، أو مشاركة من تطبيق تاني زي المعرض/واتساب).
  async function handleSharedImageIfAny() {
    if (!isSharedLaunch()) return false;
    if (getSharedKind() && getSharedKind() !== 'image') return false;
    const file = await takeSharedFile(SHARE_KEY_IMAGE);
    if (!file || !file.size) return false;
    if (!isLikelyImageFile(file)) {
      $('headline').textContent = 'الملف ده مش صورة';
      $('status').textContent = 'دبّر يستقبل نص، صوت، أو صورة فاتورة. جرّب صورة واضحة للفاتورة.';
      show('input-view', true);
      show('mode-switch', true);
      setMode('text');
      return true;
    }
    show('input-view', false);
    show('mode-switch', false);
    $('headline').textContent = 'استلمنا صورة الفاتورة';
    const imageBase64 = await blobToBase64(file);
    await analyzeInvoiceImage(imageBase64);
    return true;
  }

  async function handleSharedAudioIfAny() {
    if (!isSharedLaunch()) return false;
    if (getSharedKind() && getSharedKind() !== 'audio') return false;
    const file = await takeSharedFile(SHARE_KEY_AUDIO);
    if (!file || !file.size) return false;
    if (!isLikelyAudioFile(file)) {
      $('headline').textContent = 'الملف ده مش صوت';
      $('status').textContent = 'دبّر يستقبل نص، صوت، أو صورة فاتورة. جرّب تسجيل صوتي أو صورة فاتورة وجرب المشاركة تاني.';
      show('input-view', true);
      show('mode-switch', true);
      setMode('text');
      return true;
    }

    const durationSeconds = await readAudioDuration(file);
    if (Number.isFinite(durationSeconds) && durationSeconds > MAX_AUDIO_DURATION_SECONDS) {
      showAudioTooLongMessage();
      return true;
    }

    show('input-view', false);
    show('mode-switch', false);
    $('headline').textContent = 'استلمنا التسجيل الصوتي';
    const audioBase64 = await blobToBase64(file);
    await analyzeAudio(audioBase64, file.type || 'audio/ogg', durationSeconds);
    return true;
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      $('headline').textContent = 'سجّل دخولك الأول';
      show('auth-view', true);
      return;
    }
    accessToken = session.access_token;

    const handledSharedAudio = await handleSharedAudioIfAny();
    if (handledSharedAudio) return;

    const handledSharedImage = await handleSharedImageIfAny();
    if (handledSharedImage) return;

    const sharedText = getSharedText();
    if (sharedText) {
      show('input-view', false);
      show('mode-switch', false);
      analyzeText(sharedText);
    } else {
      $('headline').textContent = 'اكتب أو سجّل العملية';
      $('text-input').value = '';
      show('mode-switch', true);
      setMode('text');
      show('input-view', true);
    }
  })();
</script>
</body>
</html>
